apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ai-sensei-event-handler
spec:
  template:
    spec:
      containers:
      - image: event-handler-image
        ports:
        - containerPort: 8080
        env:
        - name: PROJECT_ID
          value: "ureuzy-ai" # Vertex AI & Firestore用プロジェクトID
        - name: LOCATION
          value: "global"
        # - name: AI_PROVIDER
        #   value: "gemini"          
        # - name: MODEL_NAME
        #   value: "gemini-3-flash-preview"
        - name: AI_PROVIDER
          value: "claude"          
        - name: MODEL_NAME
          value: "claude-haiku-4-5-20251001"        
        - name: MAX_RECENT_MESSAGES
          value: "10"
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              key: latest
              name: slack-sensei-bot
        - name: SLACK_SIGNING_SECRET
          valueFrom:
            secretKeyRef:
              key: latest
              name: slack-sensei-signing-secret
        - name: CLAUDE_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: claude-sensei-secret
      serviceAccountName: ai-sensei@ureuzy-common.iam.gserviceaccount.com # Vertex AI + Firestore権限が必要
