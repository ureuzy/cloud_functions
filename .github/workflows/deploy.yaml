name: Deploy audit alert

on:
  push:
    branches:
      - main

jobs:
  deploy-functions:
    name: Deploy audit alert in org aggregation logs
    runs-on: ubuntu-20.04

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: "projects/890199201495/locations/global/workloadIdentityPools/github-actions/providers/github"
          service_account: "gha-account@ureuzy-org-system.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v1'

      - name: Use to deploy a cloud function gen 2
        run: >
          gcloud functions deploy audit-alert
          --gen2
          --trigger-http
          --runtime="go120" 
          --region="asia-northeast1" 
          --source="audit-alert"
          --entry-point="Main"
          --memory="128Mi"
          --timeout="60s"
          --env-vars-file="./audit-alert/env.yaml"
          --ingress-settings="all"
          --set-secrets="SLACK_WEBHOOK=projects/ureuzy-org-system/secrets/slack_webhook:latest"